name: Test app
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.1"]
        exclude:
          - python-version: "3.11"
            django-version: "6.1"
            
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # Add a health check to ensure postgres is ready
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        version: "latest"
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      env:
        DJANGO_VERSION: ${{ matrix.django-version }}
      run: |
        uv sync --frozen --group postgres
        # uv add would fail to resolve django 6.1 for python 3.11, so override in the environment
        uv pip install "Django~=${DJANGO_VERSION}"
    - name: Run tests on python ${{ matrix.python-version }}
      env:
        BIRDS_TEST_DB: postgres
      run: uv run --no-sync pytest
